<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Soal 22</title>
  </head>
  <body>
    <h1>Soal Nomor 22</h1>

    <p id="hasil"></p>

    <script>
      let n = 3;
      let hasil = 1;
      let proses = "";

      for (let i = n; i >= 1; i--) {
        hasil = hasil * i;
        proses += i;

        if (i > 1) {
          proses += " x ";
        }
      }

      document.getElementById("hasil").innerHTML =
        n + "! = " + proses + " = " + hasil;
    </script>
  </body>
</html>
