<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>NO.16 Menampilkan Angka</h2>
    <script>
    let n = 1;

    for (let i = 1; i <= 12; i++) {
        document.write(n + " ");

        if (i % 2 == 1) {
            n = n + 4;
        } else {
            n = n - 2;
        }
    }
</script>
</body>
</html>
