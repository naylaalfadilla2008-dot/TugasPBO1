<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>NO.15 Menampilkan Angka</h2>
    <script>
    for (let i = 8; i >= 1; i--) {
        document.write(i);
    }
    for (let i = 7; i >= 1; i--) {
        document.write(i);
    }
    for (let i = 1; i <= 6; i++) {
        document.write(6);
    }
    for (let i = 1; i <= 5; i++) {
        document.write(5);
    }
    for (let i = 4; i >= 1; i--) {
        document.write(i);
    }
    for (let i = 3; i >= 1; i--) {
        document.write(i);
    }
    for (let i = 1; i <= 2; i++) {
        document.write(2);
    }
    document.write(1);
</script>
</body>
</html>
