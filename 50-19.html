<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soal 50.19</title>
</head>
<body>

    <pre id="output"></pre>

    <script>

        let hasil = "";

        // Baris atas
        for (let i = 1; i <= 7; i++) {
            hasil += "0";
        }

        hasil += "\n";

        // Bagian tengah
        for (let i = 1; i <= 4; i++) {

            hasil += "0";

            for (let j = 1; j <= 5; j++) {
                hasil += "*";
            }

            hasil += "0";
            hasil += "\n";
        }

        // Baris bawah
        for (let i = 1; i <= 7; i++) {
            hasil += "0";
        }

        hasil += "\n";

        document.getElementById("output").textContent = hasil;

    </script>

</body>
</html>
