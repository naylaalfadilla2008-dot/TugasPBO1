<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>NO.12 Menampilkan Angka</h2>
    <script>
        for (let i = 1; i <= 4; i++) {
        if (i == 1) {
            document.write("1");
        } else if (i == 2) {
            document.write("22");
        } else {
            for (let j = 1; j <= i; j++) {
                document.write(j);
            }
        }
    }
    for (let i = 1; i <= 5; i++) {
        document.write(5);
    }
    for (let i = 1; i <= 6; i++) {
        document.write(6);
    }
    for (let i = 1; i <= 7; i++) {
        document.write(i);
    }
    // 12345678
    for (let i = 1; i <= 8; i++) {
        document.write(i);
    }
    for (let i = 1; i <= 9; i++) {
        document.write(9);
    }
    document.write("...");
</script>
</body>
</html>
