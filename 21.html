<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Soal 21</title>
  </head>
  <body>
    <h1>Soal Nomor 21</h1>

    <p id="hasil"></p>

    <script>
      let angka = 1;
      let hasil = "";

      for (let i = 0; i < 10; i++) {
        hasil += angka + " ";
        angka = angka * 2;
      }

      document.getElementById("hasil").innerHTML = hasil;
    </script>
  </body>
</html>
