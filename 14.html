<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>NO.14 Menampilkan Angka</h3>
    <script>
    for (let i = 1; i <= 8; i++) {
        document.write(8);
    }
    for (let i = 1; i <= 7; i++) {
        document.write(7);
    }
    for (let i = 6; i >= 1; i--) {
        document.write(i);
    }
    for (let i = 5; i >= 1; i--) {
        document.write(i);
    }
    for (let i = 1; i <= 4; i++) {
        document.write(4);
    }
    for (let i = 1; i <= 3; i++) {
        document.write(3);
    }
    for (let i = 2; i >= 1; i--) {
        document.write(i);
    }
    document.write(1);
</script>

</body>
</html>
