<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soal 50.14</title>
</head>
<body>

    <pre id="output"></pre>

    <script>

        let hasil = "";

        for (let i = 1; i <= 6; i++) {

            // Bintang
            for (let j = 1; j <= i; j++) {
                hasil += "*";
            }

            // Angka 0
            for (let j = 1; j <= 6 - i + 1; j++) {
                hasil += "0";
            }

            hasil += "\n";
        }

        document.getElementById("output").textContent = hasil;

    </script>

</body>
</html>
