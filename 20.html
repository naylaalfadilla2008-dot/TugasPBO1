<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Soal 20</title>
  </head>
  <body>
    <h1>Soal Nomor 20</h1>

    <p id="hasil"></p>

    <script>
      let angka = 1;
      let hasil = "";

      for (let i = 0; i < 13; i++) {
        hasil += angka + " ";

        if (i % 3 == 0) {
          angka = angka + 1;
        } else if (i % 3 == 1) {
          angka = angka + 2;
        } else {
          angka = angka + 3;
        }
      }

      document.getElementById("hasil").innerHTML = hasil;
    </script>
  </body>
</html>
