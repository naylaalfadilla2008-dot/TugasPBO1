<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>NO.17 Menampilkan Angka</h3>
    <script>
    let n = 2;

    for (let i = 1; i <= 10; i++) {
        document.write(n + " ");

        if (i % 2 == 1) {
            n = n + 10;
        } else {
            n = n - 5;
        }
    }
</script>
</body>
</html>
