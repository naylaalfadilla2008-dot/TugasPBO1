<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soal 50.5</title>
</head>
<body>
    <pre id="output"></pre>

<script>
let hasil = "";

for (let i = 6; i >= 1; i--) {

    // Spasi depan
    hasil += " ".repeat(6 - i);

    // Bintang
    hasil += "*".repeat(2 * i - 1);

    hasil += "\n";
}

document.getElementById("output").textContent = hasil;
</script>
</body>
</html>
