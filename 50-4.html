<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soal 50.4</title>
</head>
<body>
    <pre id="output"></pre>

    <script>

        let hasil = "";

        hasil += '<span style="color: red;">';

        // Perulangan baris 1 sampai 5
        for (let i = 1; i <= 5; i++) {

            // Bintang sebelah kiri
            for (let j = 1; j <= i; j++) {
                hasil += "*";
            }

            // Spasi tengah
            for (let j = 1; j <= 11 - (i * 2); j++) {
                hasil += " ";
            }

            // Bintang sebelah kanan
            for (let j = 1; j <= i; j++) {
                hasil += "*";
            }

            hasil += "\n";
        }

        // Baris terakhir
        for (let i = 1; i <= 11; i++) {
            hasil += "*";
        }

        hasil += "</span>";

        document.getElementById("output").innerHTML = hasil;

    </script>
</body>
</html>
